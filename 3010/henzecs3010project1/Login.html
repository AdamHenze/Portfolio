<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="StandardCSS.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>BG-Account-Login</title>
</head>
<body>
<div class="container-fluid p-3 bgChar">
    <div class="row justify-content-end">
        <div class="col-12 col-sm-3 col-md-2 col-lg-1">
            <a href="Home.html" target="_self">Home</a>
        </div>
        <div class="col-12 col-sm-3 col-md-2 col-lg-1">
            <a href="Account.html" target="_self">Account</a>
        </div>
        <div class="col-12 col-sm-3 col-md-2 col-lg-1">
            <a href="Registration.html" target="_self">Signup</a>
        </div>
        <div class="col-12 col-sm-3 col-md-2 col-lg-1">
            <a href="Login.html" target="_self" style="color: white"><b>Login</b></a>
        </div>
        <div class="col-12 col-sm-3 col-md-2 col-lg-1">
            <a href="Home.html" target="_self">Logout</a>
        </div>
    </div>
</div>
<div class="container-fluid">
    <div class="col-12">
        <img src="img/FullLogo_Transparent_NoBuffer.png" alt="logo" class="smlogo">
    </div>
    <div class="row">
        <div class="col-0 col-sm-1 col-md-2"></div>
        <div class="col-12 col-sm-10 col-md-8 bgChar" style="padding: 20px; margin-bottom: 70px; text-align: justify">
            <div class="form-group">
                <label for="userName">User Name:</label>
                <input class="form-control" id="userName" name="userName" type="text"/>
            </div>
            <div class="form-group">
                <label for="pass">New Password:</label>
                <input class="form-control" id="pass" name="pass" type="text"/>
            </div>
            <hr>
            <input class="btn btn-primary" type="submit" value="Login"/>
            <input class="btn btn-secondary" type="reset" value="Reset"/>
        </div>
        <div class="col-0 col-sm-1 col-md-2"></div>
    </div>
</div>

<footer>
    <div class="row">
        <div class="col-12 bgChar" style="padding: 20px">
            <a href="https://www.youtube.com/@TipsfromaShipwrightvideos" target="_blank">Tips From a Shipwright</a>
        </div>
    </div>
</footer>

</body>
</html>
